<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGym - منصة اللياقة البدنية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 15px; }
        
        /* شريط البروفايل والرتب */
        .profile-card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2a2a; }
        .rank-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9em; margin-top: 5px; }
        .progress-bar-bg { background: #333; height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .progress-bar-fill { background: #00e676; height: 100%; width: 0%; transition: width 0.3s ease; }
        
        /* الدائرة الرئيسية للسعرات */
        .dashboard-circle { text-align: center; margin: 20px 0; background: #1e1e1e; padding: 20px; border-radius: 16px; border: 1px solid #2a2a2a; }
        .circle-val { font-size: 2.2em; font-weight: bold; color: #00e676; }
        
        /* أشرطة التصفية */
        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-bottom: 15px; }
        .filter-btn { background: #252525; color: #fff; border: 1px solid #333; padding: 8px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: #00e676; color: #000; font-weight: bold; }
        
        /* بطاقات التمارين */
        .workout-card { background: #1a1a1a; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-right: 4px solid #00e676; display: flex; gap: 15px; align-items: center; }
        .workout-img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; background: #252525; }
        .fav-btn { background: transparent; border: none; font-size: 1.2em; cursor: pointer; }
        .complete-btn { background: #00e676; color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- قسم البروفايل ونظام الرتب -->
    <div class="profile-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3>أهلاً بك يا بطل 🦾</h3>
                <span id="user-rank" class="rank-badge" style="background:#555; color:#fff;">حجري 🪵</span>
            </div>
            <div style="text-align: left;">
                <span style="font-size: 0.9em; color: #aaa;">الالتزام (Streak)</span>
                <div style="font-size: 1.2em; font-weight: bold; color: #ff9800;">🔥 <span id="streak-count">0</span> أيام</div>
            </div>
        </div>
        <div class="progress-bar-bg">
            <div id="xp-progress" class="progress-bar-fill"></div>
        </div>
        <div style="font-size: 0.8em; color: #aaa; margin-top: 5px; text-align: left;">
            <span id="xp-count">0</span> / <span id="next-xp">100</span> XP
        </div>
    </div>

    <!-- الدائرة الرئيسية لحساب السعرات -->
    <div class="dashboard-circle">
        <div style="color: #aaa; font-size: 0.9em; margin-bottom: 5px;">المتبقي اليومي من السعرات</div>
        <div id="remaining-calories" class="circle-val">2000</div>
        <div style="font-size: 0.8em; color: #666; margin-top: 5px;">
            مستهدف: 2000 | مأكول: <span id="eaten-cal" style="color:#fff;">0</span> | محروق: <span id="burned-cal" style="color:#00e676;">0</span>
        </div>
    </div>

    <!-- تبويب أشرطة التصفية وقائمة التمارين -->
    <section id="tab-workouts">
        <div class="filter-tabs">
            <button class="filter-btn active" onclick="filterWorkouts('all', this)">📋 الكل</button>
            <button class="filter-btn" onclick="filterWorkouts('home', this)">🏠 المنزل</button>
            <button class="filter-btn" onclick="filterWorkouts('favorites', this)">⭐ المفضلة</button>
            <button class="filter-btn" onclick="filterWorkouts('chest', this)">💪 صدر</button>
            <button class="filter-btn" onclick="filterWorkouts('legs', this)">🦵 أرجل</button>
            <button class="filter-btn" onclick="filterWorkouts('abdominals', this)">🔥 بطن</button>
        </div>

        <div id="workout-container">
            <!-- يتم تحميل البطاقات هنا تلقائياً -->
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
