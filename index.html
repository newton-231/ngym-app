<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGym - مدربك الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f0e; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .bg-gym-green { background-color: #10b981; }
        .text-gym-green { color: #10b981; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-20">

    <header class="p-4 bg-gray-900 border-b border-gray-800 flex justify-between items-center select-none" id="main-header">
        <div class="flex items-center gap-3 cursor-pointer" id="logo-trigger">
            <div class="w-10 h-10 bg-gym-green rounded-full flex items-center justify-center font-bold text-black text-xl">NG</div>
            <div>
                <h1 class="font-bold text-lg text-white">NGym</h1>
                <p class="text-xs text-gray-400" id="sub-title">جاري التحقق من الاشتراك...</p>
            </div>
        </div>
        <div class="text-left">
            <span class="text-sm font-bold text-gym-green" id="calories-display">2,400 سعرة</span>
        </div>
    </header>

    <main class="p-4 flex-1 overflow-y-auto">
        <div id="tab-nutrition" class="space-y-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-4 shadow-lg">
                <h2 class="text-md font-bold mb-2">🤖 المدرب الذكي (AI Coach)</h2>
                <div id="chat-box" class="h-64 overflow-y-auto space-y-3 p-2 bg-black/40 rounded-xl text-sm mb-3 border border-gray-800">
                    <div class="bg-gray-800 p-3 rounded-xl max-w-[85%] text-gray-200">أهلاً بك يا بطل! 🦾 هل تتمرن اليوم؟</div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="اكتب رسالتك..." class="flex-1 bg-black border border-gray-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-gym-green">
                    <button id="send-btn" class="bg-gym-green text-black font-bold px-5 py-2 rounded-xl text-sm">إرسال</button>
                </div>
            </div>
        </div>

        <div id="tab-workouts" class="space-y-4 hidden">
            <h2 class="text-lg font-bold text-gym-green mb-2">🏋️ التمارين المستقلة</h2>
            <div id="workouts-list" class="space-y-3"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 flex justify-around p-3 z-40">
        <button onclick="switchTab('nutrition')" id="btn-tab-nut" class="text-gym-green font-bold text-sm">🍏 التغذية</button>
        <button onclick="switchTab('workouts')" id="btn-tab-work" class="text-gray-400 font-bold text-sm">💪 التمارين</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
