<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NGym - تطبيق اللياقة البدنية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { green: '#22c55e', dark: '#0f172a', card: '#1e293b' }
                    }
                }
            }
        }
    </script>
    <style>
        .hidden-tab { display: none !important; }
        .active-tab { color: #22c55e; border-top: 2px solid #22c55e; }
        .filter-tab.active { background-color: #22c55e; color: #0f172a; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-20 select-none">

    <!-- شاشة التحميل -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-950 flex flex-col justify-center items-center z-50">
        <div class="w-12 h-12 border-4 border-green-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <h1 class="text-xl font-bold tracking-wider text-green-500">NGYM PRO</h1>
    </div>

    <!-- نافذة إدخال بيانات المستخدم الجديد (Onboarding Modal) -->
    <div id="onboarding-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md flex justify-center items-center z-50 p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md shadow-2xl text-right">
            <h2 class="text-xl font-bold text-green-400 mb-2 text-center">مرحباً بك في NGym! 🏋️‍♂️</h2>
            <p class="text-xs text-slate-400 mb-6 text-center">يرجى تحديد بياناتك لنتمكن من تخصيص خطتك السعرية والرياضية:</p>
            
            <form id="onboarding-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">الوزن الحالي (كجم):</label>
                    <input type="number" id="init-weight" min="30" max="250" value="70" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-green-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">الهدف الرئيسي:</label>
                    <select id="init-goal" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-green-500">
                        <option value="bulking">تضخيم وبناء عضلات (Bulking)</option>
                        <option value="cutting">تنشيف وحرق دهون (Cutting)</option>
                        <option value="fitness">لياقة بدنية وتحسين صحة (Fitness)</option>
                        <option value="women_weight_loss">إنزال الوزن للنساء (Women Weight Loss)</option>
                        <option value="calorie_deficit">إنزال الوزن بعجز سعرات بدون تمارين (Calorie Deficit)</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-green-500 text-slate-950 font-bold py-3 rounded-xl text-sm hover:bg-green-400 transition-colors mt-4">
                    حفظ وابدأ الآن 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="app" class="hidden max-w-md mx-auto relative">

        <!-- الهيدر العلوي -->
        <header class="p-4 bg-slate-900 border-b border-slate-800 flex justify-between items-center sticky top-0 z-30">
            <div id="app-logo-header" class="cursor-pointer">
                <h1 class="text-lg font-black text-green-500 tracking-wider">NGYM</h1>
            </div>
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="bg-slate-800 px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1">
                    🔥 <span id="streak-days">0</span> يوم
                </div>
                <div class="bg-slate-800 px-3 py-1 rounded-full text-xs font-semibold text-amber-400">
                    🏆 <span id="rank-badge">مبتدئ</span>
                </div>
            </div>
        </header>

        <!-- المحتوى التفاعلي (التبويبات) -->
        <main class="p-4">
            
            <!-- 1. تبويب الرئيسية -->
            <section id="tab-dashboard" class="tab-panel">
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-4">
                    <h3 class="text-xs font-bold text-slate-400 mb-3">السعرات اليومية MOCK</h3>
                    <div class="flex justify-around items-center">
                        <div class="text-center">
                            <p class="text-xl font-extrabold text-white" id="calories-left">0</p>
                            <p class="text-[10px] text-slate-400">المتبقي</p>
                        </div>
                        <div class="relative w-24 h-24 flex justify-center items-center">
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
                                <circle cx="60" cy="60" r="54" stroke="#1e293b" stroke-width="8" fill="transparent" />
                                <circle id="calories-ring" cx="60" cy="60" r="54" stroke="#22c55e" stroke-width="8" fill="transparent" stroke-linecap="round" stroke-dasharray="339.292" stroke-dashoffset="339.292" />
                            </svg>
                            <span class="absolute text-xs font-bold" id="eaten-cal">0</span>
                        </div>
                        <div class="text-center">
                            <p class="text-xl font-extrabold text-white" id="target-cal">0</p>
                            <p class="text-[10px] text-slate-400">الهدف</p>
                        </div>
                    </div>
                </div>

                <!-- الماكروز -->
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-center">
                        <p class="text-[10px] text-slate-400">بروتين</p>
                        <p id="protein-values" class="text-xs font-bold text-green-400">0/0g</p>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full mt-1 overflow-hidden">
                            <div id="protein-bar" class="bg-green-500 h-full w-0 transition-all"></div>
                        </div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-center">
                        <p class="text-[10px] text-slate-400">كارب</p>
                        <p id="carbs-values" class="text-xs font-bold text-amber-400">0/0g</p>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full mt-1 overflow-hidden">
                            <div id="carbs-bar" class="bg-amber-500 h-full w-0 transition-all"></div>
                        </div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-center">
                        <p class="text-[10px] text-slate-400">دهون</p>
                        <p id="fats-values" class="text-xs font-bold text-blue-400">0/0g</p>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full mt-1 overflow-hidden">
                            <div id="fats-bar" class="bg-blue-500 h-full w-0 transition-all"></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 2. تبويب التمارين -->
            <section id="tab-workouts" class="tab-panel hidden-tab">
                <div class="flex gap-2 overflow-x-auto pb-2 mb-3 text-xs scrollbar-none">
                    <button class="filter-tab active px-3 py-1.5 rounded-lg bg-slate-800 whitespace-nowrap" data-filter="all">الكل</button>
                    <button class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 whitespace-nowrap" data-filter="chest">صدر</button>
                    <button class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 whitespace-nowrap" data-filter="abdominals">بطن</button>
                    <button class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 whitespace-nowrap" data-filter="biceps">بايسبس</button>
                    <button class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 whitespace-nowrap" data-filter="home">منزلي</button>
                    <button class="filter-tab px-3 py-1.5 rounded-lg bg-slate-800 whitespace-nowrap" data-filter="favorites">المفضلة ⭐</button>
                </div>

                <div id="workout-list"></div>
            </section>

            <!-- 3. تبويب المدرب الذكي -->
            <section id="tab-coach" class="tab-panel hidden-tab">
                <div id="chat-messages" class="h-[65vh] overflow-y-auto p-2 bg-slate-900 rounded-xl border border-slate-800 mb-3 space-y-2"></div>
                <div class="flex items-center gap-2">
                    <input type="text" id="chat-input" placeholder="اسأل المدرب الذكي..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
                    <button id="send-chat-btn" class="bg-green-500 text-slate-950 px-3 py-2 rounded-xl text-xs font-bold">إرسال</button>
                </div>
            </section>

        </main>

        <!-- زر العائم للمدرب -->
        <button id="floating-agent-btn" class="fixed bottom-16 left-4 bg-green-500 text-slate-950 p-3 rounded-full shadow-lg z-40 font-bold text-xs">
            🤖 المدرب
        </button>

        <!-- الشريط السفلي للتنقل -->
        <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 max-w-md mx-auto flex justify-around py-2 z-40 text-xs">
            <button class="tab-btn active-tab flex flex-col items-center gap-1" data-tab="dashboard">
                <span>🏠</span><span>الرئيسية</span>
            </button>
            <button class="tab-btn flex flex-col items-center gap-1 text-slate-400" data-tab="workouts">
                <span>🏋️‍♂️</span><span>التمارين</span>
            </button>
            <button class="tab-btn flex flex-col items-center gap-1 text-slate-400" data-tab="coach">
                <span>🤖</span><span>المدرب</span>
            </button>
        </nav>

    </div>

    <script src="app.js"></script>
</body>
</html>
