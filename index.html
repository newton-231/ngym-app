<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGym - مدربك الذكي</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر واللوجو الرئيسي -->
    <header style="background: #141414; padding: 15px; text-align: center; border-bottom: 1px solid #222;">
        <h1 id="appLogo" style="color: #00ff66; margin: 0; font-size: 24px; cursor: pointer;">NGym 🦾</h1>
    </header>

    <!-- الواجهة الرئيسية للتطبيق -->
    <main id="dashboardSection" style="padding: 20px; padding-bottom: 80px;">
        
        <!-- التبويب الأول: التغذية والماكروز -->
        <section id="tabNutrition" class="tab-content">
            <h2 style="color: #00ff66; font-size: 18px; margin-bottom: 15px;">احتياجك الغذائي اليومي 🥗</h2>
            <div id="nutritionCardContainer">
                <p style="color: #aaa; font-size: 14px;">جاري تحميل البيانات الحالية...</p>
            </div>
        </section>

        <!-- التبويب الثاني: التمارين وسجل الأوزان -->
        <section id="tabWorkouts" class="tab-content" style="display: none;">
            <h2 style="color: #fff; font-size: 18px; margin-bottom: 15px;">جدول التمارين وسجل الجولات 🏋️‍♂️</h2>
            <div id="exerciseList">
                <p style="color: #aaa; font-size: 14px;">تحدث مع المدرب الذكي لترشيح جدول اليوم أو سجل أوزانك.</p>
            </div>
        </section>

    </main>

    <!-- شريط التنقل السفلي (Bottom Navigation Bar) -->
    <nav style="position: fixed; bottom: 0; left: 0; right: 0; background: #141414; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 10px 0; z-index: 999;">
        <button onclick="switchTab('tabNutrition', this)" class="nav-tab-btn active" style="background: none; border: none; color: #00ff66; font-size: 13px; font-weight: bold; cursor: pointer;">
            🥗<br>التغذية والماكروز
        </button>
        <button onclick="switchTab('tabWorkouts', this)" class="nav-tab-btn" style="background: none; border: none; color: #888; font-size: 13px; font-weight: bold; cursor: pointer;">
            🏋️‍♂️<br>التمارين
        </button>
    </nav>

    <!-- زر الـ AI Agent العائم -->
    <button id="aiChatToggleBtn" style="position: fixed; bottom: 75px; left: 20px; background: #00ff66; color: #000; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 26px; cursor: pointer; z-index: 1000; box-shadow: 0 4px 12px rgba(0,255,102,0.3);">
        🤖
    </button>

    <!-- نافذة المحادثة المباشرة مع المدرب الذكي -->
    <div id="aiChatModal" style="display: none; position: fixed; bottom: 140px; left: 20px; width: 320px; height: 400px; background: #141414; border: 1px solid #333; border-radius: 12px; z-index: 1000; flex-direction: column; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.8);">
        <!-- هنا عنوان نافذة الشات -->
        <div style="background: #222; padding: 12px; color: #00ff66; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center;">
            <span>🤖 AI Coach (Gemini)</span>
            <button id="closeChatBtn" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer;">✕</button>
        </div>
        
        <!-- هنا صندوق عرض الرسائل -->
        <div id="chatMessages" style="flex: 1; padding: 10px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 8px;">
            <div style="background: #222; color: #fff; padding: 8px 12px; border-radius: 8px; align-self: flex-start; max-width: 85%;">
                أهلاً بك يا بطل! 🦾 هل تتمرن اليوم في المنزل أم في الجيم؟ أخبرني لنحدد خطتك المناسبة!
            </div>
        </div>
        
        <!-- هنا حقل إدخال الرسالة وزر الإرسال -->
        <div style="padding: 10px; background: #1a1a1a; display: flex; gap: 5px;">
            <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." style="flex: 1; background: #0d0d0d; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; outline: none;">
            <button id="sendChatBtn" style="background: #00ff66; color: #000; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">إرسال</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
